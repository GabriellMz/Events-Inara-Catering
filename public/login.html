<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INARA | Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <button class="theme-toggle-btn theme-toggle-floating">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="container min-vh-100 d-flex flex-column justify-content-center">
        <div class="row w-100 align-items-center justify-content-center">
            
            <div class="col-lg-5 text-center text-lg-start mb-5 mb-lg-0 pe-lg-5">
                <a href="index.html">
                    <img src="./assets/img/logo.jpg" alt="INARA" class="brand-logo mb-4" style="height: 80px;">
                </a>
                <p class="fs-5" style="max-width: 400px; margin: 0 auto 0 0;">Accede a tu cuenta para continuar con tu experiencia residencial y gestionar tus eventos.</p>
            </div>

            <div class="col-lg-5 offset-lg-1">
                <div class="card-dynamic p-4 p-md-5" style="border-radius: 20px;">
                    
                    <div class="role-switch">
                        <div class="role-btn active" data-role="cliente">Cliente</div>
                        <div class="role-btn" data-role="admin">Administrador</div>
                    </div>

                    <form id="loginForm">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary text-uppercase mb-3">Email / Usuario</label>
                            <div class="login-input-group">
                                <i class="fa-regular fa-envelope icon-left"></i>
                                <input type="email" class="form-control login-input" placeholder="usuario@inara.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary text-uppercase mb-3">Contraseña</label>
                            <div class="login-input-group">
                                <i class="fa-solid fa-lock icon-left"></i>
                                <input type="password" id="loginPassword" class="form-control login-input" placeholder="••••••••••••" required>
                                <i class="fa-solid fa-eye icon-right toggle-password" data-target="loginPassword"></i>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mb-4">
                            <a href="#" class="text-accent text-decoration-none small fw-medium">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="btn-cream mb-4">INICIAR SESIÓN</button>

                        <div class="text-center small" id="registerLinkContainer">
                            <span class="text-secondary">¿No tienes una cuenta?</span> 
                            <a href="#" id="btnSwitchToRegister" class="text-accent text-decoration-underline fw-bold ms-1">Crear cuenta</a>
                        </div>
                    </form>

                    <form id="registerForm" class="d-none">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary text-uppercase mb-3">Nombre Completo</label>
                            <div class="login-input-group">
                                <i class="fa-regular fa-user icon-left"></i>
                                <input type="text" id="regNombre" class="form-control login-input" placeholder="Tu nombre" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary text-uppercase mb-3">Correo Electrónico</label>
                            <div class="login-input-group">
                                <i class="fa-regular fa-envelope icon-left"></i>
                                <input type="email" id="regEmail" class="form-control login-input" placeholder="usuario@inara.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary text-uppercase mb-3">Teléfono</label>
                            <div class="login-input-group">
                                <i class="fa-solid fa-phone icon-left"></i>
                                <input type="tel" id="regTelefono" class="form-control login-input" placeholder="+51 900 000 000" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary text-uppercase mb-3">Contraseña</label>
                            <div class="login-input-group">
                                <i class="fa-solid fa-lock icon-left"></i>
                                <input type="password" id="registerPassword" class="form-control login-input" placeholder="••••••••••••" required>
                                <i class="fa-solid fa-eye icon-right toggle-password" data-target="registerPassword"></i>
                            </div>
                        </div>

                        <button type="submit" class="btn-cream mb-4">CREAR CUENTA</button>

                        <div class="text-center small">
                            <span class="text-secondary">¿Ya tienes una cuenta?</span> 
                            <a href="#" id="btnSwitchToLogin" class="text-accent text-decoration-underline fw-bold ms-1">Iniciar sesión</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
</body>
</html>
