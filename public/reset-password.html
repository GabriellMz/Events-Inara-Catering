<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INARA | Restaurar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <button class="theme-toggle-btn theme-toggle-floating">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
        <div class="card-dynamic p-4 p-md-5 w-100" style="max-width: 500px; border-radius: 20px;">
            <div class="text-center mb-4">
                <a href="index.html">
                    <img src="./assets/img/logo.jpg" alt="INARA" class="brand-logo mb-3" style="height: 60px;">
                </a>
                <h3 class="fw-bold text-accent">Crear Nueva Contraseña</h3>
                <p class="small text-secondary">Por seguridad, asegúrate de que ambas contraseñas coincidan y tengan al menos 6 caracteres.</p>
            </div>

            <form id="formNuevaPassword">
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase mb-3">Nueva Contraseña</label>
                    <div class="login-input-group mb-1">
                        <i class="fa-solid fa-lock icon-left"></i>
                        <input type="password" id="nuevaPass" class="form-control login-input" placeholder="Mínimo 6 caracteres" required>
                        <i class="fa-solid fa-eye icon-right toggle-password" data-target="nuevaPass"></i>
                    </div>
                    <div class="error-message" id="errNueva"><i class="fa-solid fa-circle-exclamation me-1"></i> Debe tener al menos 6 caracteres.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase mb-3">Repetir Contraseña</label>
                    <div class="login-input-group mb-1">
                        <i class="fa-solid fa-lock icon-left"></i>
                        <input type="password" id="repetirPass" class="form-control login-input" placeholder="Repite la contraseña" required>
                        <i class="fa-solid fa-eye icon-right toggle-password" data-target="repetirPass"></i>
                    </div>
                    <div class="error-message" id="errRepetir"><i class="fa-solid fa-circle-exclamation me-1"></i> Las contraseñas no coinciden.</div>
                </div>

                <button type="submit" id="btnActualizarPass" class="btn-cream mb-3" style="opacity: 0.5; cursor: not-allowed;" disabled>CAMBIAR CONTRASEÑA</button>
                
                <div class="text-center">
                    <a href="login.html" class="text-secondary small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio de sesión</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nuevaPass = document.getElementById('nuevaPass');
            const repetirPass = document.getElementById('repetirPass');
            const btnActualizar = document.getElementById('btnActualizarPass');
            const errNueva = document.getElementById('errNueva');
            const errRepetir = document.getElementById('errRepetir');

            function validarPasswords() {
                let valido = true;

                if (nuevaPass.value.length > 0 && nuevaPass.value.length < 6) {
                    nuevaPass.classList.add('input-error');
                    errNueva.style.display = 'block';
                    valido = false;
                } else {
                    nuevaPass.classList.remove('input-error');
                    errNueva.style.display = 'none';
                }
                if (nuevaPass.value === '') valido = false;

                if (repetirPass.value.length > 0 && repetirPass.value !== nuevaPass.value) {
                    repetirPass.classList.add('input-error');
                    errRepetir.style.display = 'block';
                    valido = false;
                } else {
                    repetirPass.classList.remove('input-error');
                    errRepetir.style.display = 'none';
                }
                if (repetirPass.value === '') valido = false;

                if (valido) {
                    btnActualizar.disabled = false;
                    btnActualizar.style.opacity = '1';
                    btnActualizar.style.cursor = 'pointer';
                } else {
                    btnActualizar.disabled = true;
                    btnActualizar.style.opacity = '0.5';
                    btnActualizar.style.cursor = 'not-allowed';
                }
            }

            nuevaPass.addEventListener('input', validarPasswords);
            repetirPass.addEventListener('input', validarPasswords);

            // Toggle Password Vibilidad
            document.querySelectorAll('.toggle-password').forEach(toggle => {
                toggle.addEventListener('click', function () {
                    const inputId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(inputId);
                    if (passwordInput) {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        this.classList.toggle('fa-eye');
                        this.classList.toggle('fa-eye-slash');
                    }
                });
            });
        });
    </script>
    <script src="./js/supabase.js"></script>
</body>
</html>
